name: Keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = "https://t4crte-bot.onrender.com/_stcore/health"
            try { const r = await fetch(url, { signal: AbortSignal.timeout(30000) }); core.info("ping " + r.status) }
            catch (e) { core.warning("ping failed: " + e.message) }
